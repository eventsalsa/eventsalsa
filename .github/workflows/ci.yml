name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  changes:
    name: Detect Changed Modules
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-modules.yml
    with:
      target: ci

  go-module:
    name: Go (${{ matrix.module.dir }})
    needs: changes
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            ${{ matrix.module.dir }}/go.sum

      - name: Check formatting
        working-directory: ${{ matrix.module.dir }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: ${{ matrix.module.dir }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.module.dir }}
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: ${{ matrix.module.dir }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=5m

      - name: Unit tests
        working-directory: ${{ matrix.module.dir }}
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.module.key }}
          path: ${{ matrix.module.dir }}/coverage.out
          retention-days: 7

      - name: Integration tests
        if: ${{ matrix.module.integration }}
        working-directory: ${{ matrix.module.dir }}
        run: go test -p 1 -v -race -count=1 -tags=integration -timeout=300s ./...

      - name: Standalone module verification (Release PRs)
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'release-please--') &&
          matrix.module.published
        working-directory: ${{ matrix.module.dir }}
        env:
          GOWORK: "off"
        run: |
          if ! jq -e --arg dir "${{ matrix.module.dir }}" '.packages[$dir] != null' "${{ github.workspace }}/release-please-config.json" >/dev/null; then
            echo "Skipping standalone check for ${{ matrix.module.dir }} (not enabled in current release wave)"
            exit 0
          fi
          go mod verify
          go build ./...
          go test -race -count=1 ./...

  docs:
    name: Docs (Astro)
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.root == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check Cloudflare Worker
        run: ./node_modules/.bin/tsc -p tsconfig.worker.json

      - name: Build site
        run: npm run build
