name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  changes:
    name: Detect Changed Modules
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-modules.yml
    with:
      target: security

  gosec:
    name: gosec (${{ matrix.module.gosec_name }})
    needs: changes
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            ${{ matrix.module.dir }}/go.mod
            ${{ matrix.module.dir }}/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        id: run_gosec
        continue-on-error: true
        working-directory: ${{ matrix.module.dir }}
        run: gosec ${{ matrix.module.gosec_args }} -fmt sarif -out gosec-results.sarif ./...

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ matrix.module.dir }}/gosec-results.sarif
          category: gosec-${{ matrix.module.gosec_name }}

      - name: Enforce gosec status
        if: ${{ steps.run_gosec.outcome == 'failure' }}
        run: exit 1

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        env:
          MODULES_JSON: ${{ needs.changes.outputs.modules }}
        run: |
          for mod in $(printf '%s' "$MODULES_JSON" | jq -r '.[].dir'); do
            echo "==> govulncheck ($mod)"
            govulncheck -C "$mod" ./...
          done

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build all modules
        run: go build ./store/... ./snapshot/... ./projector/... ./encryption/... ./encryption/kek/awskms/... ./encryption/kek/gcpkms/... ./cqrs/...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
